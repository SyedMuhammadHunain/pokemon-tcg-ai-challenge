[project]
name = "pkmon-game"
version = "0.1.0"
description = "Pokemon TCG AI Battle Challenge"
readme = "docs/spec.md"
requires-python = ">=3.10"
dependencies = [
    "kaggle-environments",
]

[project.optional-dependencies]
lint = [
    "flake8",
    "ruff",
    "codespell",
    "ty"
]

[dependency-groups]
dev = [
    "pytest",
    "flake8",
    "ruff",
]

[tool.ruff]
exclude = ["skills"]

[tool.codespell]
skip = "skills,agent-skills,.git,.venv,uv.lock"

[tool.pyright]
exclude = ["skills", "skills/**", "agent-skills", ".venv", "**/tests", "code-review-graph"]




